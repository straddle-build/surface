<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>straddle-js demo — host page</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 2rem;
      }
      straddle-bridge {
        display: block;
        border: 1px solid #ddd;
        border-radius: 8px;
      }
      #log {
        white-space: pre-wrap;
        background: #f4f4f5;
        padding: 1rem;
        border-radius: 8px;
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <h1>Host page</h1>
    <p>
      A partner loads the published <code>straddle.js</code> bundle and drops in
      the <code>&lt;straddle-bridge&gt;</code> element — no build step, no
      subclass. The element mounts the surface at the fixed
      <code>/bridge</code> route on <code>iframe-origin</code>.
    </p>

    <!-- The standalone IIFE bundle. Loading it self-registers the element. -->
    <script src="/straddle.js"></script>

    <straddle-bridge
      iframe-origin="http://localhost:5374"
      token="dev-token-abc"
    ></straddle-bridge>

    <h2>Lifecycle log</h2>
    <div id="log"></div>

    <script>
      const log = (m) =>
        (document.getElementById('log').textContent += m + '\n')
      const el = document.querySelector('straddle-bridge')
      for (const ev of [
        'straddleready',
        'straddlecomplete',
        'straddleexit',
        'straddleerror',
      ]) {
        el.addEventListener(ev, (e) =>
          log(ev + ' ' + JSON.stringify(e.detail ?? {})),
        )
      }
    </script>
  </body>
</html>
