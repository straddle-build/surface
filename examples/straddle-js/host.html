<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>straddle-js demo</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 2rem;
      }
      #token {
        width: 32rem;
        max-width: 100%;
      }
      straddle-bridge {
        margin-top: 1rem;
        border: 1px solid #ddd;
        border-radius: 8px;
      }
      #log {
        white-space: pre-wrap;
        background: #f4f4f5;
        padding: 1rem;
        border-radius: 8px;
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <h1>straddle-js demo</h1>
    <p>
      Paste a sandbox session token, the <code>client_secret</code> your backend
      gets from <code>POST /v1/bridge/sessions</code>, and mount
      <code>&lt;straddle-bridge&gt;</code>.
    </p>
    <form id="mount">
      <input id="token" placeholder="Sandbox session token" required />
      <button>Mount</button>
    </form>
    <div id="slot"></div>

    <h2>Lifecycle log</h2>
    <div id="log"></div>

    <script src="/straddle.js"></script>
    <script>
      const log = (m) =>
        (document.getElementById('log').textContent += m + '\n')

      document.getElementById('mount').addEventListener('submit', (e) => {
        e.preventDefault()
        const el = document.createElement('straddle-bridge')
        el.setAttribute('mode', 'sandbox')
        el.setAttribute('token', document.getElementById('token').value.trim())
        for (const ev of [
          'straddleready',
          'straddlecomplete',
          'straddleexit',
          'straddleerror',
        ]) {
          el.addEventListener(ev, (e) =>
            log(ev + ' ' + JSON.stringify(e.detail ?? {})),
          )
        }
        document.getElementById('slot').replaceChildren(el)
      })
    </script>
  </body>
</html>
