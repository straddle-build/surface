name: publish-package

on:
  workflow_call:
    inputs:
      package:
        description: Package directory (e.g. packages/straddle-js)
        required: true
        type: string

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      name: ${{ steps.version.outputs.name }}
      version: ${{ steps.version.outputs.version }}
      published: ${{ steps.version.outputs.published }}
      tarball: ${{ steps.version.outputs.tarball }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          persist-credentials: false

      - name: Check whether this version is on npm
        id: version
        working-directory: ${{ inputs.package }}
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          name=$(jq -r .name package.json)
          version=$(jq -r .version package.json)
          case "$version" in
            *-*)
              echo "::error::$name@$version is a prerelease, and this repository publishes stable versions only"
              exit 1
              ;;
          esac
          published=$(npm view "$name" versions --json | jq --arg v "$version" '[.] | flatten | any(.[]; . == $v)')
          {
            echo "name=$name"
            echo "version=$version"
            echo "published=$published"
            echo "tarball=$(jq -r '"\(.name | ltrimstr("@") | sub("/"; "-"))-\(.version).tgz"' package.json)"
            echo "tag=$(basename "$PACKAGE")-v$version"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: ${{ needs.check.outputs.published == 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Rewrite manifest for publish
        working-directory: ${{ inputs.package }}
        run: bun ../../scripts/publish-manifest.ts strip

      - name: Pack
        working-directory: ${{ inputs.package }}
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ needs.check.outputs.tarball }}
          path: ${{ runner.temp }}/${{ needs.check.outputs.tarball }}
          if-no-files-found: error

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ needs.check.outputs.tarball }}

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Publish
        env:
          TARBALL: ${{ needs.check.outputs.tarball }}
        run: npm publish "$TARBALL"

  release:
    needs: [check, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ needs.check.outputs.tarball }}

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PACKAGE: ${{ inputs.package }}
          NAME: ${{ needs.check.outputs.name }}
          VERSION: ${{ needs.check.outputs.version }}
          TARBALL: ${{ needs.check.outputs.tarball }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          mkdir "$RUNNER_TEMP/unpacked"
          tar -xzf "$TARBALL" -C "$RUNNER_TEMP/unpacked"
          {
            echo "Published \`$NAME@$VERSION\` to npm."
            echo
            echo "| File | SRI hash |"
            echo "| --- | --- |"
            for file in "$RUNNER_TEMP"/unpacked/package/dist/*.js; do
              echo "| \`${file#"$RUNNER_TEMP"/unpacked/package/}\` | \`sha384-$(openssl dgst -sha384 -binary "$file" | openssl base64 -A)\` |"
            done
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Release $(basename "$PACKAGE") $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
