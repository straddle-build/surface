name: publish

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ vars.NPM_PUBLISH_ENABLED == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/straddle-js
    permissions:
      contents: write
      id-token: write
    uses: $/.github/workflows/publish-package.yml
    with:
      package: ${{ matrix.package }}
